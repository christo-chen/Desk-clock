<!doctype html>
<html lang="zh-CN" class="booting"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1C1C1E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon-180x180.png"><link rel="icon" href="%BASE_URL%logo.svg" type="image/svg+xml">
<title>桌面时钟 · Desk Clock</title>
<style>html{background:#1C1C1E}body{margin:0} @media(prefers-color-scheme:light){html{background:#F2F2F7}}</style>
<script>try{const s=JSON.parse(localStorage.getItem('deskclock:v1')||'null');if(s){const night=s.appearance?.mode==='night'||(s.appearance?.mode==='system'&&matchMedia('(prefers-color-scheme:dark)').matches)||(s.appearance?.mode==='schedule'&&(()=>{const m=new Date().getHours()*60+new Date().getMinutes();const p=x=>{const [h,n]=x.split(':').map(Number);return h*60+n};const a=p(s.appearance.dayAt),b=p(s.appearance.nightAt);return !(a<=b?m>=a&&m<b:m>=a||m<b)})());const backgrounds={"pure":["#F2F2F7","#1C1C1E"],"bauhaus":["#F1EDE4","#141414"],"nixie":["#EDE3D6","#0B0806"],"split-flap":["#E9E4DA","#0F0F0F"],"polar":["#ECEFF4","#2E3440"],"phosphor":["#E4ECE4","#050A06"],"synthwave":["#F3E9F5","#262335"],"neon-city":["#EDF3F7","#0D0B1A"],"forest":["#FDF6E3","#2D353B"],"solar":["#FDF6E3","#002B36"],"latte":["#EFF1F5","#1E1E2E"],"morandi":["#E3DDD5","#2B2829"],"ink":["#EFE9DC","#16161A"],"ukiyo-e":["#F2ECBC","#1F1F28"],"eink":["#F4ECD8","#1A1814"],"rose":["#FAF4ED","#191724"],"chrono":["#E7DCC6","#1D1B17"],"rainfall":["#C9D0D6","#121820"],"realm":["#E9DDC2","#16130F"],"hellas":["#EAE3D6","#0F1A2B"]};document.documentElement.style.background=s.custom?.[night?'night':'day']?.bg||(backgrounds[s.theme]||backgrounds.pure)[night?1:0]}}catch{}</script>
</head><body><main id="app"></main><script type="module" src="/src/main.ts"></script></body></html>
